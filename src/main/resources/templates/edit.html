<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" xmlns:layout="http://wwwultraq.net.nz/thymeleaf/layout" layout:decorate="layout">
	<head>
		<meta charset="utf-8">
		<title>Saisir un article</title>
	</head>	
	<body>
		<div layout:fragment="content">
			<div class="col-md-4 col-xs-8">
				<div class="panel panel-primary">
					<div class="panel-heading">Editer un nouvel article</div>
					<div class="panel-body">
						<form th:action="@{/update}" method="post">
							<div class="form-group">
								<label class="control-label">Description : </label>
								<input type="text" class="form-control" name="description" th:value="${article.description}">
								<span th:errors="${article.description}"></span>
							</div>
							<div class="form-group">
								<label class="control-label">Marque : </label>
								<input type="text" class="form-control" name="brand" th:value="${article.brand}">
								<span th:errors="${article.brand}"></span>
							</div>
							<div class="form-group">
								<label class="control-label">Price : </label>
								<input type="text" class="form-control" name="price" th:value="${article.price}">
								<span th:errors="${article.price}"></span>
							</div>
							<div hidden>
								<input type="text" class="form-control" name="id" th:value="${article.id}">
							</div>
							<button type="submit" class="btn btn-primary">Save</button>
						</form>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
