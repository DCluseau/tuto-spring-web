<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" xmlns:layout = "http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate = "layout">
	<head>
		
	</head>
	<body>
		<div layout:fragment="content">
			<div class="panel panel-primary">
				<div class="panel-heading">Catégorie <span th:text="${category}"></span></div>
				
				<div class="panel-body">
					<form th:action="@{/index}" method="get">
						<label>Keyword</label>
						<input type="text" name="keyword" th:value="${keyword}">
						<button type="submit" class="btn btn-primary">Search</button>
					</form>
				</div>
				
				<div class="panel-body">
					<table class="table">
						<tr>
							<th>Id</th>
							<th>Description</th>
							<th>Marque</th>
							<th>Prix</th>
							<th></th>
							<th></th>
							<th></th>
						</tr>	
						<tr th:each="a:${listArticle}">
							<td th:text="${a.id}"></td>
							<td th:text="${a.description}"></td>
							<td th:text="${a.brand}"></td>
							<td th:text="${a.price}"></td>
							<td>
								<a th:href="@{/addtocart(id=${a.id})}"><span class="glyphicon glyphicon-shopping-cart"></span></a>
							</td>
							<td>
								<a th:href="@{/delete(id=${a.id}, page=${currentPage}, keyword=${keyword})}" class="btn btn-danger">Delete</a>
							</td>
							<td>
								<a th:href="@{/edit(id=${a.id})}" class="btn btn-primary">Edit</a>
							</td>
						</tr>
					</table>
				</div>
				<div class="panel-footer">
					<ul class="nav nav-pills">
						<li th:class="${currentPage==status.index}?'active':''" th:each="page, status:${pages}">
							<a th:href="@{/category(page=${status.index},category=${category})}" th:text="${status.index+1}"></a>
						</li>
					</ul>
				</div>
			</div>
		</div>
	</body>
</html>
